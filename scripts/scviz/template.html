<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SystemC Module Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #10141c; color: #d7dce4;
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 16px 0 0; font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    background: #1d2530; color: #d7dce4; border: 1px solid #2c3644;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #273142; }
  button.primary { background: #2b5bd7; border-color: #3a6cf0; }
  select, input[type=range] { background: #1d2530; color: #d7dce4; border: 1px solid #2c3644; border-radius: 6px; }
  select { padding: 6px 8px; }
  .readout { font-variant-numeric: tabular-nums; color: #9fd3ff; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; font-size: 12px; color: #9aa4b2; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .panel { background: #141a24; border: 1px solid #232c3a; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: #8b96a8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  svg text { font-family: system-ui, "Segoe UI", sans-serif; }
  .node rect { transition: fill .15s, stroke .15s; }
  .node.active rect { fill: #23406e; stroke: #5aa2ff; }
  .node .clk-pulse { fill: #4da3ff; }
  .wire { stroke: #3a4656; fill: none; }
  .wire.clock { stroke: #5b6a7d; stroke-dasharray: 5 4; }
  .wire.fifo { stroke-width: 2.5; }
  .wire.pulse { stroke: #ffd166; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ffd166); }
  .arrow { fill: #5b6a7d; }
  .port-dot { fill: #8b96a8; }
  .port-dot.out { fill: #6fbf8f; }
  .port-label { fill: #8b96a8; font-size: 10px; }
  .fifo-label { fill: #aeb9c7; font-size: 11px; font-variant-numeric: tabular-nums; }
  .task-row text { font-size: 11px; fill: #9aa4b2; }
  .grid-line { stroke: #1d2530; }
  .axis-text { fill: #6b7684; font-size: 10px; }
  .playhead { stroke: #ffd166; stroke-width: 1.5; }
  .playhead.clock { stroke: #4da3ff; stroke-dasharray: 3 3; }
  #events-now { color: #ffd166; font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>SystemC Module Viewer</h1>
  <div class="controls">
    <button id="btn-start" title="jump to 0">&#171;</button>
    <button id="btn-prev" title="step back (←)">&#9664;</button>
    <button id="btn-play" class="primary" title="play/pause (space)">&#9654; Play</button>
    <button id="btn-next" title="step forward (→)">&#9658;</button>
    <button id="btn-end" title="jump to end">&#187;</button>
    <label>speed
      <select id="speed">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
        <option value="20">20x</option>
      </select>
    </label>
    <input id="scrub" type="range" min="0" max="1" value="0" style="width:260px">
    <span class="readout" id="cycle-readout">cycle 0</span>
  </div>
</header>

<div id="events-now"></div>

<div class="legend" id="legend"></div>

<div class="panel">
  <h2>Module &amp; connection structure</h2>
  <svg id="graph" width="1000" height="300"></svg>
</div>

<div class="panel">
  <h2>Simulation cycles (per task, from event trace)</h2>
  <svg id="wave" width="1000" height="260"></svg>
</div>

<script id="scviz-data" type="application/json">__SCVIZ_DATA__</script>

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("scviz-data").textContent);
  var END = data.trace.end;
  var modules = data.modules;
  var wires = data.wires;
  var trace = data.trace;
  var clockId = data.meta.clock;

  // ---- derived maps -------------------------------------------------------
  var moduleById = {};
  var moduleByType = {};
  modules.forEach(function (m) {
    moduleById[m.id] = m;
    if (m.type !== "Clock" && !(m.type in moduleByType)) moduleByType[m.type] = m.id;
  });
  function moduleIdForEvent(event) {
    var type = trace.event_module[event];
    return type ? moduleByType[type] : null;
  }

  // events grouped by cycle
  var eventsByCycle = {};
  trace.tasks.forEach(function (task) {
    Object.keys(task.events).forEach(function (event) {
      var cycle = task.events[event];
      (eventsByCycle[cycle] = eventsByCycle[cycle] || []).push(event);
    });
  });

  function isOutgoing(event) {
    return event === "output" || /_(emit|send)$/.test(event);
  }

  // ---- layout constants ----------------------------------------------------
  var GW = document.getElementById("graph").width.baseVal.value;
  var GH = document.getElementById("graph").height.baseVal.value;
  var WW = document.getElementById("wave").width.baseVal.value;
  var WH = document.getElementById("wave").height.baseVal.value;

  // graph layout: one row of modules, clock centered above
  var nonClock = modules.filter(function (m) { return m.type !== "Clock"; });
  var nodeW = 170, nodeH = 74, gapX = 130, marginX = 40;
  var moduleY = 150;
  var clockW = 140, clockH = 44, clockY = 36;

  function nodeX(i) { return marginX + i * (nodeW + gapX); }

  // ---- build graph ---------------------------------------------------------
  var graphSvg = document.getElementById("graph");
  var neededW = nodeX(Math.max(0, nonClock.length - 1)) + nodeW + marginX;
  if (neededW > graphSvg.width.baseVal.value) graphSvg.setAttribute("width", neededW);
  var NS = "http://www.w3.org/2000/svg";
  var portDots = {}; // nodeId -> portName -> {x,y}
  var nodeEls = {};
  var clockEl = null;
  var wireEls = [];

  function svgEl(tag, attrs, parent) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(el);
    return el;
  }

  // clock node
  if (clockId) {
    var clockX = (nodeX(nonClock.length - 1) + nodeW - clockW) / 2;
    var g = svgEl("g", { "class": "node", id: "node-" + clockId }, graphSvg);
    var rect = svgEl("rect", { x: clockX, y: clockY, width: clockW, height: clockH, rx: 10,
                               fill: "#182030", stroke: "#5b6a7d", "stroke-width": 1.5 }, g);
    svgEl("text", { x: clockX + clockW / 2, y: clockY + 20, "text-anchor": "middle", fill: "#9fd3ff", "font-size": 13, "font-weight": 600 }, g)
      .textContent = "Clock";
    svgEl("text", { x: clockX + clockW / 2, y: clockY + 35, "text-anchor": "middle", fill: "#8b96a8", "font-size": 10 }, g)
      .textContent = clockId + " · " + data.meta.clock_period_ns + " ns";
    clockEl = { g: g, rect: rect };
  }

  // module nodes
  nonClock.forEach(function (m, i) {
    var x = nodeX(i);
    var g = svgEl("g", { "class": "node", id: "node-" + m.id }, graphSvg);
    var rect = svgEl("rect", { x: x, y: moduleY, width: nodeW, height: nodeH, rx: 10,
                               fill: "#1a2230", stroke: "#3a4656", "stroke-width": 1.5 }, g);
    svgEl("text", { x: x + nodeW / 2, y: moduleY + 24, "text-anchor": "middle", fill: "#e6ebf2", "font-size": 15, "font-weight": 600 }, g)
      .textContent = m.type;
    svgEl("text", { x: x + nodeW / 2, y: moduleY + 40, "text-anchor": "middle", fill: "#8b96a8", "font-size": 11 }, g)
      .textContent = m.id;
    svgEl("text", { x: x + nodeW / 2, y: moduleY + 56, "text-anchor": "middle", fill: "#6b7684", "font-size": 9.5 }, g)
      .textContent = m.events.join("  ") || " ";
    nodeEls[m.id] = { g: g, rect: rect };
    portDots[m.id] = {};
  });

  // port dots
  function portSide(port) {
    if (port.direction === "out" || port.direction === "inout") return "right";
    if (/clk/i.test(port.name)) return "top";
    return "left";
  }
  modules.forEach(function (m) {
    if (m.type === "Clock") return;
    var box = m.type === "Clock" ? { x: clockX, y: clockY, w: clockW, h: clockH } : nodeBox(m.id);
    var left = [], right = [], top = [];
    m.ports.forEach(function (p) {
      var side = portSide(p);
      if (side === "right") right.push(p); else if (side === "top") top.push(p); else left.push(p);
    });
    function dot(cx, cy, p) {
      svgEl("circle", { cx: cx, cy: cy, r: 4, "class": "port-dot " + (p.direction === "out" || p.direction === "inout" ? "out" : "") }, graphSvg);
      svgEl("text", { x: cx, y: cy - 7, "text-anchor": "middle", "class": "port-label" }, graphSvg).textContent = p.name;
      portDots[m.id][p.name] = { x: cx, y: cy };
    }
    function place(list, side) {
      var n = list.length || 1;
      list.forEach(function (p, j) {
        var t = n === 1 ? 0.5 : (j + 0.5) / n;
        if (side === "left") dot(box.x, box.y + box.h * t, p);
        else if (side === "right") dot(box.x + box.w, box.y + box.h * t, p);
        else dot(box.x + box.w * t, box.y, p);
      });
    }
    place(left, "left"); place(right, "right"); place(top, "top");
  });
  function nodeBox(id) {
    var idx = nonClock.findIndex(function (m) { return m.id === id; });
    return { x: nodeX(idx), y: moduleY, w: nodeW, h: nodeH };
  }

  // wires
  wires.forEach(function (w) {
    var path, from, to;
    if (w.kind === "clock") {
      var cb = clockEl ? { x: clockX + clockW / 2, y: clockY + clockH } : null;
      var dot = portDots[w.target] && portDots[w.target][w.target_port];
      from = cb; to = dot;
      if (from && to) {
        path = "M " + from.x + " " + from.y + " L " + to.x + " " + to.y;
        svgEl("path", { d: path, "class": "wire clock" }, graphSvg);
        return;
      }
      return;
    }
    // fifo / signal
    from = portDots[w.source] && portDots[w.source][w.source_port];
    to = portDots[w.target] && portDots[w.target][w.target_port];
    if (!from || !to) return;
    var dx = Math.max(24, Math.abs(to.x - from.x) / 2);
    path = "M " + from.x + " " + from.y +
           " C " + (from.x + dx) + " " + from.y + ", " + (to.x - dx) + " " + to.y +
           ", " + to.x + " " + to.y;
    var p = svgEl("path", { d: path, "class": "wire " + w.kind, "data-source": w.source, "data-label": w.label }, graphSvg);
    // arrow head
    var midX = (from.x + to.x) / 2;
    svgEl("polygon", { points: (to.x - 8) + "," + (to.y - 4) + " " + (to.x - 1) + "," + to.y + " " + (to.x - 8) + "," + (to.y + 4), "class": "arrow" }, graphSvg);
    svgEl("text", { x: midX, y: Math.min(from.y, to.y) - 10, "text-anchor": "middle", "class": "fifo-label" }, graphSvg)
      .textContent = w.label || "";
    wireEls.push({ el: p, source: w.source });
  });

  // ---- build waveform ------------------------------------------------------
  var waveSvg = document.getElementById("wave");
  var plotL = 70, plotR = WW - 16, plotW = plotR - plotL;
  var rowH = 16, rowGap = 5, topPad = 34, bottomPad = 6;
  var scale = plotW / (END + 1);
  function wx(cycle) { return plotL + cycle * scale; }

  // axis
  for (var c = 0; c <= END + 1; c += 5) {
    svgEl("line", { x1: wx(c), y1: topPad - 6, x2: wx(c), y2: topPad + trace.tasks.length * (rowH + rowGap), "class": "grid-line" }, waveSvg);
    svgEl("text", { x: wx(c), y: topPad - 12, "text-anchor": "middle", "class": "axis-text" }, waveSvg).textContent = c;
  }

  trace.tasks.forEach(function (task, i) {
    var y = topPad + i * (rowH + rowGap);
    svgEl("text", { x: plotL - 8, y: y + rowH - 4, "text-anchor": "end", "class": "task-row" }, waveSvg)
      .textContent = "t" + task.id;
    task.intervals.forEach(function (iv) {
      var x0 = wx(iv[0]), x1 = wx(iv[1]);
      var color = trace.colors[iv[2]] || "#888";
      svgEl("rect", { x: x0, y: y, width: Math.max(1, x1 - x0), height: rowH - 3, rx: 3, fill: color, opacity: 0.85 }, waveSvg);
    });
    if (task.events.output !== undefined) {
      var ox = wx(task.events.output);
      svgEl("rect", { x: ox - 1, y: y - 2, width: 2, height: rowH + 2, fill: "#ffffff" }, waveSvg);
    }
  });

  var playhead = svgEl("line", { x1: wx(0), y1: topPad - 6, x2: wx(0), y2: topPad + trace.tasks.length * (rowH + rowGap), "class": "playhead" }, waveSvg);
  var playheadClock = svgEl("line", { x1: wx(0), y1: topPad - 6, x2: wx(0), y2: topPad + trace.tasks.length * (rowH + rowGap), "class": "playhead clock" }, waveSvg);

  // ---- legend --------------------------------------------------------------
  var legend = document.getElementById("legend");
  trace.symbols.forEach(function (s) {
    var sp = document.createElement("span");
    var chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = trace.colors[s];
    sp.appendChild(chip);
    sp.appendChild(document.createTextNode(s + " " + trace.labels[s]));
    legend.appendChild(sp);
  });

  // ---- playback ------------------------------------------------------------
  var currentCycle = 0;
  var playing = false;
  var speed = 2;
  var lastTs = null;
  var accumulator = 0;
  var scrub = document.getElementById("scrub");
  scrub.max = END;

  function clamp(c) { return Math.max(0, Math.min(END, c)); }

  function renderCycle(cycle) {
    var px = wx(cycle);
    playhead.setAttribute("x1", px); playhead.setAttribute("x2", px);
    playheadClock.setAttribute("x1", px); playheadClock.setAttribute("x2", px);
    document.getElementById("cycle-readout").textContent = "cycle " + cycle + " / " + END;

    // clear active / pulse
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].g.classList.remove("active");
    });
    wireEls.forEach(function (w) { w.el.classList.remove("pulse"); });

    var events = eventsByCycle[cycle] || [];
    var activeModules = {};
    events.forEach(function (event) {
      var mid = moduleIdForEvent(event);
      if (mid) activeModules[mid] = (activeModules[mid] || []).concat([event]);
    });
    Object.keys(activeModules).forEach(function (id) {
      if (nodeEls[id]) nodeEls[id].g.classList.add("active");
      if (clockEl) clockEl.rect.classList.add("clk-pulse");
      // pulse outgoing fifo wires of this module
      wireEls.forEach(function (w) {
        if (w.source === id && activeModules[id].some(isOutgoing)) w.el.classList.add("pulse");
      });
    });
    document.getElementById("events-now").textContent =
      events.length ? ("events @ " + cycle + ":  " + events.join(" · ")) : "";
  }

  function setCycle(c) {
    currentCycle = clamp(c);
    scrub.value = currentCycle;
    renderCycle(currentCycle);
  }

  function frame(ts) {
    if (playing) {
      if (lastTs === null) lastTs = ts;
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      accumulator += speed * dt;
      if (accumulator >= 1) {
        var steps = Math.floor(accumulator);
        accumulator -= steps;
        if (currentCycle >= END) { setCycle(0); }
        else { setCycle(currentCycle + steps); }
      }
    } else {
      lastTs = null; accumulator = 0;
    }
    requestAnimationFrame(frame);
  }

  function togglePlay() {
    playing = !playing;
    document.getElementById("btn-play").innerHTML = playing ? "&#9646; Pause" : "&#9654; Play";
  }

  document.getElementById("btn-play").addEventListener("click", togglePlay);
  document.getElementById("btn-prev").addEventListener("click", function () { playing = false; togglePlay(); setCycle(currentCycle - 1); });
  document.getElementById("btn-next").addEventListener("click", function () { setCycle(currentCycle + 1); });
  document.getElementById("btn-start").addEventListener("click", function () { setCycle(0); });
  document.getElementById("btn-end").addEventListener("click", function () { setCycle(END); });
  document.getElementById("speed").addEventListener("change", function (e) { speed = parseInt(e.target.value, 10); });
  scrub.addEventListener("input", function () { setCycle(parseInt(scrub.value, 10)); });
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT")) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowLeft") { setCycle(currentCycle - 1); }
    else if (e.key === "ArrowRight") { setCycle(currentCycle + 1); }
  });

  setCycle(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
